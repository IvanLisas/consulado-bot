name: check-citas
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Forzar un aviso de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-citas
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest test_check
      - name: Revisar página
        run: python check.py
        env:
          FORCE_ALERT: ${{ inputs.force_alert }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "consulado-bot"
            git config user.email "consulado-bot@users.noreply.github.com"
            git add state.json
            git commit -m "estado del bot"
            git pull --rebase -q
            git push -q
          fi
